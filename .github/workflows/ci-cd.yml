name: CI/CD - gestion-user

on:
  push:
    branches: [ "main", "gestion-user" ]
  pull_request:
    branches: [ "main", "gestion-user" ]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🧪 Run Tests + Coverage
        run: mvn clean test jacoco:report
        working-directory: gestion-user

      - name: 📊 SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        working-directory: gestion-user

      - name: 📦 Build JAR
        run: mvn package -DskipTests
        working-directory: gestion-user

      - name: 🐳 Build Docker image
        run: docker build -t gestion-user:latest .
        working-directory: gestion-user

      - name: 🔐 Login to Nexus (via ngrok)
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
          NEXUS_REGISTRY: ${{ secrets.NEXUS_REGISTRY }}
        run: echo "$NEXUS_PASS" | docker login --username "$NEXUS_USER" --password-stdin https://$NEXUS_REGISTRY

      - name: 📤 Push Docker image to Nexus
        env:
          NEXUS_REGISTRY: ${{ secrets.NEXUS_REGISTRY }}
        run: |
          docker tag gestion-user:latest $NEXUS_REGISTRY/repository/docker-hosted/gestion-user:latest
          docker push $NEXUS_REGISTRY/repository/docker-hosted/gestion-user:latest